services:
  # Polling web app
  next_webapp:
    restart: unless-stopped
    build:
      context: .
    image: ghcr.io/andresborn/polling-webapp:${IMAGE_TAG:-main}
    container_name: next_webapp
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - BETTER_AUTH_SECRET=temporary_secret
      - BETTER_AUTH_URL=temporary_secret
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  # Postgres Database
  db:
    image: postgres:18
    restart: always
    user: ${POSTGRES_USER}
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  migrate:
    build:
      context: .
      target: builder
    command: npx drizzle-kit migrate
    image: ghcr.io/andresborn/polling-webapp-migrate:${IMAGE_TAG:-main}
    profiles: ["tools"] # excluded from plain `up -d`; `run migrate` still works
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  # Web server
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    volumes:
      - ./conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db-data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
